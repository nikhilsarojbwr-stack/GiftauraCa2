{% extends 'shared/base.html' %}

{% block title %}Register — GiftAura+{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- ====================================================
             REGISTER HEADER
             ==================================================== -->

        <h2>Create Your Account</h2>

        <p>
            Join GiftAura+ and start creating memorable gifts.
        </p>


        <!-- ====================================================
             ERROR MESSAGE
             ==================================================== -->

        {% if message %}

        <div class="alert-error">
            {{ message }}
        </div>

        {% endif %}


        <!-- ====================================================
             REGISTER FORM
             ==================================================== -->

        <form
            method="POST"
            action="/register"
            class="auth-form"
        >

            <!-- Full Name -->

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Sarah Johnson"
                    value="{{ full_name if full_name else '' }}"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    value="{{ email if email else '' }}"
                    required
                >

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="9876543210"
                    value="{{ phone if phone else '' }}"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    minlength="8"
                    required
                >

            </div>


            <!-- =================================================
                 TERMS
                 ================================================= -->

            <div class="form-options">

                <label class="terms">

                    <input
                        type="checkbox"
                        name="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">
                            Terms of Service
                        </a>
                        and
                        <a href="#">
                            Privacy Policy
                        </a>
                    </span>

                </label>

            </div>


            <!-- =================================================
                 REGISTER BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="btn-primary auth-btn"
            >
                Create Account
            </button>

        </form>


        <!-- ====================================================
             LOGIN LINK
             ==================================================== -->

        <p class="auth-switch">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </p>

    </div>

</div>

{% endblock %}
