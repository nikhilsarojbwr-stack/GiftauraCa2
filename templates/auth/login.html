{% extends 'shared/base.html' %}

{% block title %}Login — GiftAura+{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <!-- ====================================================
             LOGIN HEADER
             ==================================================== -->

        <h2>Welcome Back</h2>

        <p>
            Sign in to your GiftAura+ account.
        </p>


        <!-- ====================================================
             ERROR MESSAGE
             ==================================================== -->

        {% if message %}

        <div class="alert-error">
            {{ message }}
        </div>

        {% endif %}


        <!-- ====================================================
             LOGIN FORM
             ==================================================== -->

        <form
            method="POST"
            action="/login"
            class="auth-form"
        >

            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    value="{{ email if email else '' }}"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                >

            </div>


            <!-- =================================================
                 LOGIN INFORMATION
                 ================================================= -->

            <div class="form-options">

                <span>
                    Sign in to continue to GiftAura+.
                </span>

            </div>


            <!-- =================================================
                 LOGIN BUTTON
                 ================================================= -->

            <button
                type="submit"
                class="btn-primary auth-btn"
            >
                Sign In
            </button>

        </form>


        <!-- ====================================================
             REGISTER LINK
             ==================================================== -->

        <p class="auth-switch">

            Don't have an account?

            <a href="/register">
                Create one
            </a>

        </p>

    </div>

</div>

{% endblock %}
